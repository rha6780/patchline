{{define "content"}}
{{$L := .L}}
<div class="narrow">
<h1>{{t $L "ui.change_password"}}</h1>
{{if .P.MustChangePassword}}<p class="note">{{t $L "ui.must_change"}}</p>{{end}}
<form class="card form" method="post" action="/account/password">
  <input type="hidden" name="csrf" value="{{.P.CSRF}}">
  <input type="text" name="username" value="admin" autocomplete="username" hidden>
  <label><span>{{t $L "ui.password_current"}}</span><input type="password" name="current" autocomplete="current-password" required></label>
  <label><span>{{t $L "ui.password_new"}}</span><input type="password" name="password" minlength="{{.Min}}" maxlength="72" autocomplete="new-password" required></label>
  <label><span>{{t $L "ui.password_confirm"}}</span><input type="password" name="confirm" minlength="{{.Min}}" maxlength="72" autocomplete="new-password" required></label>
  <p class="meta">{{t $L "ui.password_rules" .Min}}</p>
  <div class="row"><button class="btn primary" type="submit">{{t $L "ui.save"}}</button></div>
</form>
</div>
{{end}}
