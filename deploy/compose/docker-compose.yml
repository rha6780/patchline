# Patchline demo: Dependency-Track (API server + frontend + PostgreSQL) and Patchline.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # optional: change ports / secrets
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
#   Patchline            http://localhost:18080/readyz
#   Dependency-Track UI  http://localhost:18082   (first login: admin / admin)
#   Dependency-Track API http://localhost:18081
#
# See deploy/compose/README.md for wiring the Dependency-Track webhook.
# The Dependency-Track API server needs several GB of memory; give Docker at
# least 8 GB. Default credentials are for local demos only.

name: patchline-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DT_DB_PASSWORD:-dtrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dtrack-apiserver:
    image: dependencytrack/apiserver:4.14.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: ${DT_DB_PASSWORD:-dtrack}
    volumes:
      - dtrack-data:/data
    ports:
      - "${DT_API_PORT:-18081}:8080"
    restart: unless-stopped

  dtrack-frontend:
    image: dependencytrack/frontend:4.14.0
    depends_on:
      - dtrack-apiserver
    environment:
      # The browser calls the API directly, so this must be the host-side URL.
      API_BASE_URL: http://localhost:${DT_API_PORT:-18081}
    ports:
      - "${DT_UI_PORT:-18082}:8080"
    restart: unless-stopped

  patchline:
    build:
      context: ../..
    depends_on:
      - dtrack-apiserver
    environment:
      PATCHLINE_LOG_LEVEL: debug
      # Demo only: read without signing in, so the curl steps in README.md work.
      # Sign in as admin / admin to change things.
      PATCHLINE_ALLOW_ANONYMOUS: "true"
      PATCHLINE_INVENTORY_PATH: /etc/patchline/inventory
      PATCHLINE_POLICY_PATH: /etc/patchline/policy/policy.yaml
      PATCHLINE_WEBHOOK_TOKEN: ${PATCHLINE_WEBHOOK_TOKEN:-change-me}
      PATCHLINE_GITEA_WEBHOOK_SECRET: ${PATCHLINE_GITEA_WEBHOOK_SECRET:-}
      PATCHLINE_DT_URL: http://dtrack-apiserver:8080
      PATCHLINE_DT_API_KEY: ${PATCHLINE_DT_API_KEY:-}
      PATCHLINE_DT_UI_URL: http://localhost:${DT_UI_PORT:-18082}
      PATCHLINE_DT_RECONCILE_DELAY: ${PATCHLINE_DT_RECONCILE_DELAY:-2m}
      PATCHLINE_SLACK_BOT_TOKEN: ${PATCHLINE_SLACK_BOT_TOKEN:-}
      PATCHLINE_SLACK_DEFAULT_CHANNEL: ${PATCHLINE_SLACK_DEFAULT_CHANNEL:-}
      PATCHLINE_NOTIFY_MIN_SEVERITY: ${PATCHLINE_NOTIFY_MIN_SEVERITY:-medium}
      PATCHLINE_NOTIFY_LANG: ${PATCHLINE_NOTIFY_LANG:-en}
    volumes:
      - patchline-data:/data
      - ../../examples/inventory:/etc/patchline/inventory:ro
      - ../../examples/policy:/etc/patchline/policy:ro
    ports:
      - "127.0.0.1:${PATCHLINE_PORT:-18080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  dtrack-data:
  patchline-data:
