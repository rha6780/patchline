# Patchline demo. By default Patchline detects vulnerabilities itself: SBOMs
# uploaded to it are matched against OSV (language packages) and a Trivy
# server (OS packages). Dependency-Track is optional.
#
#   make demo-up && make demo-seed                    # Patchline + Trivy
#   make demo-up PROFILE=dependency-track && make demo-seed-dt   # + Dependency-Track
#
#   Patchline            http://localhost:18080
#   Dependency-Track UI  http://localhost:18082   (profile dependency-track)
#   Dependency-Track API http://localhost:18081   (profile dependency-track)
#
# See deploy/compose/README.md. Default credentials are for local demos only.

name: patchline-demo

services:
  patchline:
    build:
      context: ../..
    depends_on:
      - trivy
    environment:
      PATCHLINE_LOG_LEVEL: debug
      # Demo only: read without signing in, so the curl steps in README.md work.
      # Sign in as admin / admin to change things.
      PATCHLINE_ALLOW_ANONYMOUS: "true"
      PATCHLINE_INVENTORY_PATH: /etc/patchline/inventory
      PATCHLINE_POLICY_PATH: /etc/patchline/policy/policy.yaml
      PATCHLINE_WEBHOOK_TOKEN: ${PATCHLINE_WEBHOOK_TOKEN:-change-me}
      PATCHLINE_GITEA_WEBHOOK_SECRET: ${PATCHLINE_GITEA_WEBHOOK_SECRET:-}
      # Built-in detection: OSV for the sample's ecosystems (add PyPI, Go, ...
      # as needed; npm's first download is about 220 MB), Trivy for OS packages.
      PATCHLINE_OSV_ECOSYSTEMS: ${PATCHLINE_OSV_ECOSYSTEMS:-Maven,npm}
      PATCHLINE_TRIVY_URL: http://trivy:8080
      PATCHLINE_TRIVY_TOKEN: ${TRIVY_TOKEN:-patchline-demo-trivy}
      # Dependency-Track (profile dependency-track): make demo-seed-dt writes
      # the API key and the UI URL to .env.
      PATCHLINE_DT_URL: http://dtrack-apiserver:8080
      PATCHLINE_DT_API_KEY: ${PATCHLINE_DT_API_KEY:-}
      PATCHLINE_DT_UI_URL: ${PATCHLINE_DT_UI_URL:-}
      PATCHLINE_DT_RECONCILE_DELAY: ${PATCHLINE_DT_RECONCILE_DELAY:-2m}
      PATCHLINE_SLACK_BOT_TOKEN: ${PATCHLINE_SLACK_BOT_TOKEN:-}
      PATCHLINE_SLACK_DEFAULT_CHANNEL: ${PATCHLINE_SLACK_DEFAULT_CHANNEL:-}
      PATCHLINE_NOTIFY_MIN_SEVERITY: ${PATCHLINE_NOTIFY_MIN_SEVERITY:-medium}
      PATCHLINE_NOTIFY_LANG: ${PATCHLINE_NOTIFY_LANG:-en}
    volumes:
      - patchline-data:/data
      - ../../examples/inventory:/etc/patchline/inventory:ro
      - ../../examples/policy:/etc/patchline/policy:ro
    ports:
      - "127.0.0.1:${PATCHLINE_PORT:-18080}:8080"
    restart: unless-stopped

  # Trivy server: Patchline's engine for OS packages, and Dependency-Track's
  # analyzer when that profile runs.
  trivy:
    image: aquasec/trivy:${TRIVY_VERSION:-0.76.1}
    command: ["server"]
    environment:
      TRIVY_LISTEN: "0.0.0.0:8080"
      TRIVY_TOKEN: ${TRIVY_TOKEN:-patchline-demo-trivy}
    volumes:
      - trivy-cache:/root/.cache/trivy
    restart: unless-stopped

  # --- Optional: Dependency-Track (PROFILE=dependency-track) ---------------
  # The API server needs several GB of memory; give Docker at least 8 GB.

  postgres:
    profiles: [dependency-track]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DT_DB_PASSWORD:-dtrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dtrack-apiserver:
    profiles: [dependency-track]
    image: dependencytrack/apiserver:4.14.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: ${DT_DB_PASSWORD:-dtrack}
    volumes:
      - dtrack-data:/data
    ports:
      - "127.0.0.1:${DT_API_PORT:-18081}:8080"
    restart: unless-stopped

  dtrack-frontend:
    profiles: [dependency-track]
    image: dependencytrack/frontend:4.14.0
    depends_on:
      - dtrack-apiserver
    environment:
      # The browser calls the API directly, so this must be the host-side URL.
      API_BASE_URL: http://localhost:${DT_API_PORT:-18081}
    ports:
      - "127.0.0.1:${DT_UI_PORT:-18082}:8080"
    restart: unless-stopped

volumes:
  patchline-data:
  trivy-cache:
  postgres-data:
  dtrack-data:
