# Patchline demo: Dependency-Track (API server + frontend + PostgreSQL) and Patchline.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
#   Patchline            http://localhost:8080/healthz
#   Dependency-Track UI  http://localhost:8082   (first login: admin / admin)
#   Dependency-Track API http://localhost:8081
#
# The Dependency-Track API server needs several GB of memory; give Docker at
# least 8 GB. Credentials below are for local demos only.

name: patchline-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: dtrack
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack -d dtrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dtrack-apiserver:
    image: dependencytrack/apiserver:4.14.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: dtrack
    volumes:
      - dtrack-data:/data
    ports:
      - "8081:8080"
    restart: unless-stopped

  dtrack-frontend:
    image: dependencytrack/frontend:4.14.0
    depends_on:
      - dtrack-apiserver
    environment:
      API_BASE_URL: http://localhost:8081
    ports:
      - "8082:8080"
    restart: unless-stopped

  patchline:
    build:
      context: ../..
    environment:
      PATCHLINE_LOG_LEVEL: debug
    volumes:
      - patchline-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  dtrack-data:
  patchline-data:
