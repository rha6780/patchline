# Example service inventory. In a real setup this lives in its own Git
# repository and changes through pull requests.
#
# A project is the name SBOMs are uploaded under (/ingest/sbom?project=...,
# or the Dependency-Track project name), and belongs to exactly one service.
# A repository's projects default to the last segment of its path
# (acme/storefront-api -> "storefront-api"); list them explicitly when the
# app SBOM and the image SBOM are uploaded as separate projects.
#
# The upload's *version* is the environment (for example "main" for the
# default branch and "prod" for deployed images). See docs/projects.md.

services:
  - name: storefront
    owners: [alice@example.com, bob@example.com]
    slack_channel: "#team-storefront"
    exposure: internet          # internet | internal | private
    repositories:
      - repo: acme/storefront-api
        projects: [storefront-api, storefront-api-image]
      - repo: acme/storefront-web

  - name: billing
    owners: [carol@example.com]
    slack_channel: "#team-billing"
    exposure: internal
    repositories:
      - repo: acme/billing
